<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blockbeat 808 – the block puzzle with a beat</title>
<meta name="description" content="Free for Android and iPhone. No pop-up ads.">
<meta name="theme-color" content="#08080A">
<!-- Link preview in Teams, WhatsApp, Slack etc. (owner 2026-11-13: English,
     with a picture; share.png = 1200x630, made from the site's own logo). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Blockbeat 808">
<meta property="og:title" content="Blockbeat 808 – the block puzzle with a beat">
<meta property="og:description" content="Free for Android and iPhone. No pop-up ads.">
<meta property="og:image" content="https://blockbeat808.github.io/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../icon.png?v=2">
<link rel="stylesheet" href="../style.css?v=3">
<!-- One link for everyone (owner 2026-11-11): Android -> Google Play,
     iPhone -> App Store (once ../stores.js says appleLive), everything else
     (computer, iPhone before the release) sees both buttons. Used by the
     game's "Einladen" text (lib/ui/invite.dart) and for posters/videos. -->
<script src="../stores.js?v=3"></script>
<script>
  if (BB.android) location.replace(BB.play);
  else if (BB.ios && BB.appleLive) location.replace(BB.apple);
</script>
</head>
<body>
<main>
  <div class="hero">
    <img src="../icon.png?v=2" alt="">
    <div class="title">
      <div class="t1"><span class="b">BLOCK</span><span class="c">BEAT</span></div>
      <svg viewBox="0 0 200 84" role="img" aria-label="808">
        <defs><linearGradient id="g808" x1="0" x2="1"><stop offset="0" stop-color="#FF5CD6"/><stop offset="1" stop-color="#18FFFF"/></linearGradient></defs>
        <text x="100" y="72" text-anchor="middle" font-family="ChakraPetch, sans-serif" font-weight="700" font-size="86"
          fill="#121216" stroke="url(#g808)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">808</text>
      </svg>
      <div class="bar"></div>
    </div>
  </div>
  <div class="card">
    <h2 id="h">Blockbeat 808 holen</h2>
    <p id="p">Das Block-Puzzle mit dem Beat – kostenlos für Android und iPhone.</p>
    <div class="stores" id="stores"><a href="https://play.google.com/store/apps/details?id=com.blockbeat808.game">Google Play</a></div>
  </div>
</main>
<script>
  (function () {
    var p = document.getElementById('p');
    BB.badges(document.getElementById('stores'), null, '../');
    if (!BB.appleLive && BB.ios) p.textContent = BB.de ? 'Auf dem iPhone kommt Blockbeat 808 bald in den App Store.'
        : 'Blockbeat 808 is coming to the App Store for iPhone soon.';
    if (!BB.de) {
      document.documentElement.lang = 'en';
      document.getElementById('h').textContent = 'Get Blockbeat 808';
      if (BB.appleLive || !BB.ios) p.textContent = 'The block puzzle with a beat – free for Android and iPhone.';
    }
  })();
</script>
</body>
</html>
