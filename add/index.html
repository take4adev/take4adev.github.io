<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freund hinzufügen – Blockbeat 808</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080A">
<link rel="icon" href="../icon.png?v=2">
<link rel="stylesheet" href="../style.css?v=2">
<!-- Friend QR code from the game (owner 2026-11-02, lib/ui/invite.dart): with
     the game installed Android opens this link in the game itself (App Link,
     ../.well-known/assetlinks.json), which opens the friend's Play Games
     profile. This page only shows without the game (owner's variant B
     2026-11-03): "follow" = the profile by Play Games name (?n=, Google's
     share link my.play/<name>), and the store. Old codes carried ?p=<id>. -->
</head>
<body>
<main>
  <div class="hero">
    <img src="../icon.png?v=2" alt="">
    <div class="title">
      <div class="t1"><span class="b">BLOCK</span><span class="c">BEAT</span></div>
      <svg viewBox="0 0 200 84" role="img" aria-label="808">
        <defs><linearGradient id="g808" x1="0" x2="1"><stop offset="0" stop-color="#FF5CD6"/><stop offset="1" stop-color="#18FFFF"/></linearGradient></defs>
        <text x="100" y="72" text-anchor="middle" font-family="ChakraPetch, sans-serif" font-weight="700" font-size="86"
          fill="#121216" stroke="url(#g808)" stroke-width="5" stroke-linejoin="round" paint-order="stroke">808</text>
      </svg>
      <div class="bar"></div>
    </div>
  </div>
  <div class="card">
    <h2 id="h">Freund hinzufügen</h2>
    <p id="p">Ein Freund hat dir seinen Blockbeat-Code gezeigt. Folge ihm bei Google Play Spiele und hol dir
      Blockbeat 808 – dann seht ihr euch in der Bestenliste.</p>
    <nav>
      <a class="primary" id="follow" href="https://play.google.com/games/profile">Profil folgen</a>
      <a id="store" href="https://play.google.com/store/apps/details?id=com.blockbeat808.game">Blockbeat holen</a>
    </nav>
  </div>
</main>
<script>
  (function () {
    var name = new URLSearchParams(location.search).get('n') || '';
    var follow = document.getElementById('follow');
    if (/^[^\/?#&<>"\\]{1,40}$/.test(name)) {
      follow.href = 'https://my.play/' + encodeURIComponent(name);
    } else {
      // An old code (player id) or none: no profile to open.
      follow.style.display = 'none';
      document.getElementById('store').className = 'primary';
    }
    if (!/^de/i.test(navigator.language || '')) {
      document.documentElement.lang = 'en';
      document.title = 'Add a friend – Blockbeat 808';
      document.getElementById('h').textContent = 'Add a friend';
      document.getElementById('p').textContent = 'A friend showed you their Blockbeat code. Follow them on Google ' +
        'Play Games and get Blockbeat 808 – then you see each other on the leaderboard.';
      follow.textContent = 'Follow profile';
      document.getElementById('store').textContent = 'Get Blockbeat';
    }
  })();
</script>
</body>
</html>
